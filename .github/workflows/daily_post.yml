name: Daily Telegram Post

on:
  schedule:
    - cron: '0 5 * * *'    # 10:00 (O'zbekiston vaqti, UTC+5)
    - cron: '0 10 * * *'   # 15:00
    - cron: '0 13 * * *'   # 18:00
  workflow_dispatch:
jobs:
  send-post:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Shriftlarni o'rnatish
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install anthropic python-telegram-bot python-dotenv Pillow apscheduler requests

      - name: Postni yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py

      - name: Xatolik bo'lsa xabar yuborish
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${ADMIN_CHAT_ID}" \
            -d text="⚠️ Diqqat! Bugungi avtomatik post yuborishda xatolik yuz berdi. GitHub Actions'ni tekshiring."